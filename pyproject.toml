[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "espmap"
version = "0.1.2"
description = "Electrostatic-potential maps for organic molecules, with a colormap that is not a dataviz disaster"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Thanakrit (Austin) Wongsatit" }]
keywords = ["chemistry", "electrostatic potential", "DFT", "visualisation",
            "colormap", "sigma-hole", "molecular surface"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-image>=0.21",
  "pyscf>=2.3",
  "rdkit>=2023.3",
  "cmcrameri>=1.7",
  "colorspacious>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "plotly>=5"]
viz = ["plotly>=5"]
opt = ["pyberny>=0.6"]

[project.urls]
Homepage = "https://github.com/Azuromalachite/espmap"
Issues = "https://github.com/Azuromalachite/espmap/issues"

[project.scripts]
espmap = "esp_map:main"

[tool.setuptools]
py-modules = ["esp_map"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: performs a real SCF calculation"]
