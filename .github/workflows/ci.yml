name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"     # monthly: the slow, SCF-backed suite

jobs:
  fast:
    name: fast suite (no SCF)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  release:
    name: release evidence is about this tag's code
    # review 7 R7-14: a v* tag needs bench/acceptance_v<version>.json from
    # bench/acceptance.py --suite on the same code (only prose may differ)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python bench/check_release.py "${{ github.ref_name }}"

  slow:
    name: slow smoke (real SCF, bounded)
    # only on demand and monthly: genuine DFT, minutes. The hour-scale ensemble
    # and comparison cases (marker 'release') are not run here: a job that
    # predictably times out is noise. They run for a release, on the release
    # commit, by bench/acceptance.py --suite, and the v* tag job checks that
    # evidence (the user's review of the v0.3.1 branch).
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - run: python esp_map.py --selftest
      - run: pytest -q --runslow -m "slow and not release"
